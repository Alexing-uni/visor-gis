name: Publicar visor en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Compilar modalidad estática
        run: npm run build:pages
        env:
          VITE_STORAGE_MODE: browser
          # base_path vacío para sitios de usuario o dominios propios; /repo en sitios de proyecto.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4

  cleanup:
    name: Limpiar despliegues anteriores
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Conservar solo el despliegue publicado
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              ...repo, environment: 'github-pages', per_page: 100
            });
            const current = deployments.find(d => d.sha === context.sha);
            if (!current) throw new Error('No se encuentra el despliegue actual; se conserva el historial.');
            const {data: states} = await github.rest.repos.listDeploymentStatuses({
              ...repo, deployment_id: current.id, per_page: 1
            });
            if (states[0]?.state !== 'success') {
              throw new Error('El despliegue actual no está confirmado; se conserva el historial.');
            }
            for (const old of deployments) {
              if (old.environment !== 'github-pages' || old.id >= current.id) continue;
              await github.rest.repos.createDeploymentStatus({
                ...repo, deployment_id: old.id, state: 'inactive', auto_inactive: false,
                description: 'Sustituido por la publicación actual'
              });
              await github.rest.repos.deleteDeployment({...repo, deployment_id: old.id});
              core.info(`Eliminado registro anterior ${old.id}`);
            }
